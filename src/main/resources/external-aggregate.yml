# ==============================================================================
# 外部值聚合策略表（MosaicGem）
#
# 【解决什么问题】
#   一件装备上有多颗宝石、且它们带有同名外部值时，"装备级外部值"需要合成一个结果。
#   本表按「外部值名」查策略。名单可能很长（几十上百条很常见），所以单独抽成一份文件，
#   不塞进 config.yml。
#
# 【在哪里生效】
#   取值层（MosaicGem 合并外部值时读取）。
#   PAPI 占位符、MM 的 socketvalue、其它插件读到的都已经是合并后的结果，
#   各消费端不需要、也不应该各自判断策略。
#
# 【匹配优先级（从高到低）】
#   1) keys.<值名>                                     精确匹配（本文件）
#   2) config.yml 的 settings.external-aggregate-by-key  旧写法，仍兼容
#   3) prefixes.<前缀>                                  前缀匹配（多条命中时取最长前缀）
#   4) default                                          兜底（也可用 config.yml 的 settings.external-aggregate）
#
# 【可用策略（支持中文写法）】
#   first  保留首个命中（默认）—— 原始 roll、概率、开关、唯一性标记
#   sum    数值相加（小数位取参与求和者的最大位数）—— 攻击力、暴击率等可叠加值
#   max    取最大值（数值）—— "取最强那颗"
#   min    取最小值（数值）
#   非数值遇到 sum / max / min 会自动退化为 first
#
# 【用法示例】
#   keys:
#     总攻击力: sum
#     暴击率: 相加                 # 中文写法等价
#     缩小量: first
#   prefixes:
#     'bakamc_attributes:攻击': sum      # 该前缀下的所有外部值一律相加
# ==============================================================================

# 兜底策略：未被任何规则命中时使用
default: first

# 精确匹配：把需要特殊策略的值名都列在这里（名单长也没关系）
keys:
  总攻击力: sum

# 前缀匹配：值名很多且规律一致时用它，避免列出上百条
prefixes: {}
