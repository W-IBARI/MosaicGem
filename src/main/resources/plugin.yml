name: MosaicGem
version: '${projectVersion}'
main: com.mosaicgem.plugin.MosaicGemPlugin
api-version: '26.1'
folia-supported: true
softdepend:
  - SX-Attribute
  - CrazyEnchantments
  - MythicMobs
  - MythicCrucible
  - CraftEngine
  - PlaceholderAPI
authors:
  - MosaicGem
description: 宝石镶嵌插件（打孔 / 镶嵌 / 拆卸），支持 SX-Attribute

commands:
  mosaicgem:
    description: MosaicGem 主指令
    usage: /mosaicgem <reload|give|debug|list|selftest>
    aliases:
      - mg
      - mgem

permissions:
# 默认全部为 OP；如需调整，请修改插件根目录的 permissions.yml
  mosaicgem.reload:
    default: op
    description: 重载 MosaicGem 配置
  mosaicgem.give:
    default: op
    description: 给予宝石/打孔器/拆卸器
  mosaicgem.debug:
    default: op
    description: 查看物品调试信息
  mosaicgem.list:
    default: op
    description: 查看已配置物品列表
