  附魔测试宝石:
    material: PAPER
    isEnchant: true
    name: "&d附魔测试宝石"
    lore:
      - ''
      - '&7可镶嵌的装备类型: &f剑'
      - ''
      - '&f[ &d附魔属性 &f]'
      - '&a▪ 锋利等级：${random_value}'
    custom-model-data: 0
    targetType:
      - SWORD
    targetMaterial:
      - IRON_SWORD
    repetitions: 5
    random:
      random_value: '1~5'
    # 拆卸时宝石损毁（消失）概率，0~100 对应 0%~100%（不填默认 0 = 不损毁）；
    # 与拆卸器成功率无关，拆卸成功后仍需独立过此判定，命中则宝石不返还。
    remove-destroy-chance: 0
    buffs:
      - type: enchant
        attribute:
          - 'minecraft:sharpness: ${random_value}'
          - 'minecraft:unbreaking: 1'
