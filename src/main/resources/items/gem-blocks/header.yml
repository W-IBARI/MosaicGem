# 宝石配置
# items 目录下的任意 .yml（含子目录）都会被尝试识别为物品配置；
# 文件顶层使用 gems: / punchers: / removers: 段声明物品类型，可多个段共存于同一文件。
# 本文件在插件首次启动时按已安装的软依赖自动生成：
#   - 已安装 SX-Attribute   -> 生成 SA测试宝石（sx_attribute）
#   - 已安装 MythicMobs     -> 生成 MM技能测试宝石（mythicmobs_skill）
#   - 原版属性 / 附魔示例宝石始终生成，不依赖任何插件
# 之后新安装软依赖时，删除本文件并执行 /mosaicgem reload 可重新生成。
# 内部名:
#   material: 物品材质
#   isEnchant: 是否附魔（光效）
#   name: 物品名称
#   lore: 物品lore（支持 ${随机数名} 占位符）
#   custom-model-data: 自定义模型序号
#   targetType: 可镶嵌的物品类型，不填默认全生效
#   targetMaterial: 可镶嵌的物品id，不填默认全生效
#   repetitions: 可重复镶嵌次数，不填默认无上限
#   gemtype: 宝石类型标签（字符串列表，可多个），如 ['攻击', '火属性']
#     与 config.yml 的 settings.gem-type-limit 配合：限制一件装备上同一 gemtype
#     标签的宝石数量上限；不填则为空列表，不参与类型计数
#   remove-destroy-chance: 拆卸时宝石损毁（消失）概率，0~100 对应 0%~100%
#     不填默认 0（永不损毁）；数值越界自动钳制到 0~100
#     与拆卸器成功率无关：拆卸器判定成功后仍需独立过此判定，命中则宝石不返还
#   random: 创建随机数（生成时随机取值，并应用到其他部分）
#   buffs: v1.2+ 词条列表（可多条；一颗宝石可同时携带多种加成方式）
#     每条词条 = type(加成生效方式) + attribute(该方式的行)
#     旧版 buffType + attribute 自动转成单条词条（向后兼容；若配置了 buffs 则优先使用 buffs）
#   type: 加成生效方式
#     sx_attribute：SX 属性，属性行写入装备 lore，由 SX-Attribute 读取
#     vanilla_attribute：原版属性，直接附加到装备的属性修饰符（AttributeModifier）
#     enchant：附魔，直接附加/叠加到装备的原版附魔（CrazyEnchantments 附魔用 ce: 前缀）
#     mythicmobs_skill：MythicMobs 技能，镶嵌后按 MythicMobs 规则发动技能
#       attribute 格式：'技能名 @触发器'（如 'TestSkill @onSwing'），不写触发器默认 @onSwing；
#       安装 MythicCrucible 时由其物品技能系统触发（SWING/USE/RIGHTCLICK 等），
#       未安装时回退到内置的近战攻击触发（仅 onSwing/onAttack 类触发器生效）
#   attribute: 该词条注入的属性行（格式与旧版 attribute 完全一致）
#     sx_attribute 格式：'标识符: 属性名: 数值'（如 '1: 攻击力: ${random_value}'）
#       标识符由宝石自身 LoreChange 映射（如 '- 1: 攻击力'）；无映射的属性不动作
#     vanilla_attribute 格式：'原版属性id：数值'（如 'minecraft:attack_damage: ${random_value}'）
#     原版属性 id 的显示名在 messages/<语言>.yml 的 attribute-names 段中配置
#     enchant 格式：'附魔id：等级'（如 'minecraft:sharpness: ${random_value}' 或 'ce:Wither: 2'）
#     附魔 id 的显示名在 messages/<语言>.yml 的 enchant-names 段中配置
#     附魔 id 的显示名在 messages/<语言>.yml 的 enchant-names 段中配置
#   external-values（别名 external / 外部值）：外部值段，供外部插件取用
#     写法：值名 -> 表达式/常量（求值规则同 lore 里的 ${...}，可用 random 段的变量）
#     ！公式必须整体写进 ${}：${roll*2} 才是运算；写成 ${roll}*2 只会把变量替换成数字后原样拼接
#     后面的键可以引用前面已求值的键（按声明顺序求值）
#     ！不要用与 random 段变量同名的键存放「加工后的值」：外部值优先级高于原始 roll，同名会盖掉
#     ！接口约定（键名/取值优先级/语义）见 AI工作\GemBridge\README.md（读取方：GemBridge 的 socketvalue）
#     宝石生成时求值一次并写入物品数据，镶嵌时复制到装备；不参与 lore 展示，玩家看不到
#     数据位置：物品 PDC 的 mosaicgem:external（宝石物品上为自己的值；装备上为全部宝石按
#     策略合并后的聚合值，策略表见 external-aggregate.yml，由取值层统一处理）
#     读取方式：物品 PDC / PlaceholderAPI 占位符 / 插件 API

