  SA测试宝石:
    material: PAPER
    isEnchant: true
    name: "&cSA测试宝石"
    lore:
      - ''
      - '&7可镶嵌的装备类型: &f剑'
      - ''
      - '&f[ &c宝石属性 &f]'
      - '&a▪ 伤害增加：${random_value}'
    custom-model-data: 0
    targetType:
      - SWORD
    targetMaterial:
      - IRON_SWORD
    repetitions: 5
    # 宝石类型标签（可多个）：配合 config.yml 的 settings.gem-type-limit 限制
    # 一件装备上同一标签宝石的数量；不填则不参与类型计数
    gemtype:
      - 攻击
    random:
      random_value: '10.00~20.00'
    # 拆卸时宝石损毁（消失）概率，0~100 对应 0%~100%（默认 0 = 不损毁）。
    # 与拆卸器成功率无关：拆卸器判定成功后仍需独立过此判定，命中则宝石不返还。
    remove-destroy-chance: 0
    # v1.2+ 词条列表（旧版 buffType + attribute 仍兼容，自动转单条词条）
    buffs:
      - type: sx_attribute
        attribute:
          - '1: 攻击力: ${random_value}'
          - '2: 防御力: ${random_value}'
    LoreChange:
      - 1: 攻击力
      - 2: 防御力
