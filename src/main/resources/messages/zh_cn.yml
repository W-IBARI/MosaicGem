# 玩家消息（策划可自行修改文案；{xxx} 为变量占位符）
# 语言文件命名规则：messages_<语言>.yml，由 config.yml 的 settings.language 选择
# 内置语言：zh_cn（简体中文）、en_us（English）
# 所有未成功的交互都会提示玩家，各消息对应的拦截场景如下：
#   punch-max-global            打孔：物品孔数已达到该物品的上限（按 id>类型>全局 分层取值）
#   punch-max-source            打孔：该打孔器类型给此物品贡献的孔数已达到自身上限
#   punch-fail                  打孔：成功率判定失败（工具已消耗，物品与已镶嵌宝石不受影响）
#   socket-no-hole              镶嵌：物品还没有任何孔位（未打孔）
#   socket-full                 镶嵌：物品孔位已满
#   socket-repeat-limit         镶嵌：同一种宝石已达到可重复镶嵌次数上限
#   socket-gemtype-limit        镶嵌：该物品上同 gemtype 标签的宝石已达到全局上限（settings.gem-type-limit）
#   socket-bufftype-unsupported 镶嵌：宝石的 buffType 不受支持（当前仅支持 sx_attribute / vanilla_attribute / enchant）
#   remove-empty                拆卸：物品上没有已镶嵌的宝石
#   remove-fail                 拆卸：成功率判定失败（工具已消耗）
#   remove-destroyed            拆卸：拆卸器判定成功，但宝石自身损毁判定命中（宝石消失，不返还）
#   target-invalid              操作：目标物品类型/材质不符合工具限制
#   interaction-disabled        操作：该交互方式（铁砧/合成/拖拽）已在配置中禁用
#   tool-config-missing         拖拽：工具在配置中不存在（配置被删改后常见）
#   invalid-combination         拖拽：两个物品都是工具，或组合无效
#   inventory-full              返还宝石时背包已满，宝石掉落在脚边
messages:
  prefix: '&8[&6MosaicGem&8] '
  no-permission: '&c你没有权限执行该指令！'
  reload-success: '&a配置已重载。'
  give-usage: '&c用法: /mosaicgem give <id> [数量] [玩家]'
  give-not-found: '&c未找到对应的{type}配置: &f{id}'
  give-not-found-all: '&c未找到对应的物品配置: &f{id}'
  give-ambiguous: '&c找到多个同名物品，请指定类型: &f{types}'
  give-success: '&a已给予 &f{player} &a{amount} 个 &f{id}'
  player-not-found: '&c找不到玩家: &f{player}'
  debug-usage: '&c用法: /mosaicgem debug [玩家]'
  list-usage: '&c用法: /mosaicgem list <gem|puncher|remover>'
  punch-success: '&a打孔成功！当前孔数: &f{holes}&a/&f{max}'
  punch-max-global: '&c打孔失败：该物品的孔数已达到上限（{max}）！'
  punch-max-source: '&c打孔失败：该打孔器类型已达到来源上限（{max}）！'
  punch-fail: '&c打孔失败，打孔器已消耗！'
  socket-success: '&a宝石镶嵌成功！'
  socket-no-hole: '&c镶嵌失败：该物品还没有孔位，请先打孔！'
  socket-full: '&c镶嵌失败：该物品的孔位已满！'
  socket-repeat-limit: '&c该宝石已达到可重复镶嵌次数上限！'
  socket-gemtype-limit: '&c镶嵌失败：该物品上“{label}”类型宝石已达到上限（{limit}颗），无法镶嵌！'
  socket-bufftype-unsupported: '&c镶嵌失败：该宝石的属性类型不受支持，无法镶嵌！'
  remove-success: '&a宝石拆卸成功，宝石已返还。'
  remove-fail: '&c拆卸失败，拆卸器已消耗！'
  remove-empty: '&c拆卸失败：该物品没有已镶嵌的宝石！'
  remove-destroyed: '&c拆卸成功，但宝石在拆卸过程中损毁了！'
  target-invalid: '&c该物品不能进行此操作！'
  interaction-disabled: '&c该交互方式已被禁用！'
  tool-config-missing: '&c该工具在配置中不存在，请联系管理员！'
  invalid-combination: '&c工具与目标物品的组合无效！'
  inventory-full: '&e背包已满，返还物品已掉落在地上。'
  help-title: '&f指令帮助'
  help-reload: '&7/mosaicgem reload &8- &f重载配置'
  help-give: '&7/mosaicgem give <id> [数量] [玩家] &8- &f给予物品'
  help-debug: '&7/mosaicgem debug [玩家] &8- &f查看物品调试信息'
  help-list: '&7/mosaicgem list <gem|puncher|remover> &8- &f查看已配置物品'
  help-selftest: '&7/mosaicgem selftest &8- &f自检配置与数据读写'
  debug-no-item: '&c{player} 主手没有物品'
  debug-title: '&7===== MosaicGem Debug ====='
  debug-holder: '&f持有者: &e{player}'
  debug-item: '&f物品: &e{item}'
  debug-amount: '&f数量: &e{amount}'
  debug-display-name: '&f显示名: &e{name}'
  debug-custom-model-data: '&fCustomModelData: &e{value}'
  debug-enchant-glint: '&f附魔光效: &e{value}'
  debug-lore: '&fLore:'
  debug-plugin-item: '&f插件物品: &e{type} &7({id})'
  debug-random-values: '&f随机数:'
  debug-holes: '&f孔数: &e{holes} &7/ 已镶嵌: &e{gems}'
  debug-socketed-gems: '&f已镶嵌宝石:'
  debug-injected-line: '&7注入: {line}'
  debug-component-keys: '&f组件键: {keys}'
  debug-end: '&7===== Debug End ====='
  list-result: '&a{type} ({count}): &f{ids}'
  selftest-title: '&7===== MosaicGem Selftest ====='
  selftest-pass-fail: '&a通过: &f{ok} &7/ 失败: &f{fail}'
  selftest-gem-fail: '&c宝石 [&f{id}&c] 失败: {error}'
  selftest-puncher-fail: '&c打孔器 [&f{id}&c] 失败: {error}'
  selftest-remover-fail: '&c拆卸器 [&f{id}&c] 失败: {error}'
