# MosaicGem 主配置
settings:
  # 消息语言（对应加载 messages/<语言>.yml；内置语言：zh_cn / en_us）
  language: zh_cn
  # 单个物品可拥有的最大孔数（全局硬上限，不论孔来自哪个打孔器，总和均不可超过）
  max-holes: 6
  # gemtype 标签全局数量限制：key 为宝石配置里的 gemtype 标签名，value 为
  # 一件装备上同一标签的宝石最多可镶嵌数量（0 或缺省 = 不限制）。
  # 示例：'攻击: 2' 表示带"攻击"标签的宝石一件装备最多镶嵌 2 颗。
  gem-type-limit:
    攻击: 2
  # 交互方式开关
  interactions:
    # 铁砧合成
    anvil: true
    # 工作台 / 随身合成
    crafting: true
    # 拖拽工具到目标物品上
    drag: true

# 装备上的镶嵌信息 lore（打孔/镶嵌/拆卸成功后自动更新）
# 占位符：
#   {holes}      已经镶嵌的孔洞数（孔内宝石数）
#   {max_holes}  物品可用的孔洞数（已打孔数）
#   {gem_count}  已镶嵌宝石数量
#   {index}      宝石序号（从 1 开始）
#   {gem}        宝石显示名
#   {id}         宝石内部名
#   {values}     宝石数值描述（如：攻击力：20.00）
#   {value_lines} 宝石数值描述（每个属性单独一行）
socket-lore:
  enabled: true
  lines:
    - ''
    - '&r&f[ &6镶嵌信息 &f]'
    - '&r&7孔位: &f{holes}&7/&f{max_holes}'
  gem-lines:
    - '&r&7宝石{index}: &f{gem}'
    - '&r&7  {value_lines}'
  empty-line: '&r&7暂无宝石'

# SX-Attribute 属性面板合并（仅作用于 buffType: sx_attribute 的宝石）：
# 镶嵌后把宝石属性合并进物品原有的属性行
# 例：物品原行 '攻击力：13.90' + 宝石 20 -> '攻击力：33.90（+20）'
# 属性名由各宝石配置的 LoreChange 映射提供（标识符 -> 属性名），无映射的属性不动作。
# 占位符：
#   {name}  属性名
#   {value} 属性总值
#   {bonus} 宝石加成值（自动去掉多余的小数零）
attribute-lore:
  enabled: true
  # 宝石属性在物品上没有对应行时，追加的新属性行模版
  new-line: '&r&f{name}：&e{value}'
  # 加成标注格式（跟在数值后）
  bonus-format: '&r（+{bonus}）'
